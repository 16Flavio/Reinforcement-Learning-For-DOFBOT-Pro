[project]
name = "projet-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "16Flavio", email = "230736@umons.ac.be" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "mujoco>=4.0.1",
    "opencv-python-headless>=4.8",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
]

[project.scripts]
projet-rl = "projet_rl:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
